# unbound 配置 · ipaudit 专用解析器
# 目的：直连 DNSBL 权威服务器（绕开 Spamhaus 对公共解析器的拒绝与限流），
#       并给 ipaudit --resolver / serve 提供干净的递归出口。
#
# 监听与访问控制原则（防被扫成开放 DNS 放大器）：
#   1. 工具和解析器同机  → 只监听 127.0.0.1:53，谁也扫不到
#   2. 跨机（VPS 扫描节点 ↔ 解析节点）→ 只监听 WireGuard 内网 IP，防火墙 + access-control
#      双层白名单；绝不能同时绑 0.0.0.0 又不加 ACL。
#   3. 公网 VPS 上跑 unbound 时，recursion 默认拒绝所有未授权网段——
#      开放递归 = 被拿去打 DNS 放大攻击 = IP 进黑名单，正好毁掉这门生意。
#
# 两套方案按部署形态二选一，改完 `unbound-check` 校验再 reload。

server:
    # ------------------------------------------------ 同机部署（方案 A）
    # 工具与解析器同一台机器：只听回环，最安全，优先选这个。
    interface: 127.0.0.1
    port: 53

    # ------------------------------------------------ 跨机部署（方案 B）
    # 只监听 WireGuard 内网地址（示例 10.66.0.1，按你的 wg 网段改）。
    # 与方案 A 二选一；interface 可写多行。
    # interface: 10.66.0.1

    # ------------------------------------------------ 访问控制
    # 只放行回环（方案 A）或 wg 网段（方案 B）。未列出的网段一律 refuse。
    access-control: 127.0.0.0/8 allow
    access-control: 10.66.0.0/24 allow      # 方案 B：WireGuard 网段，按实际改
    access-control: 0.0.0.0/0 refuse        # 兜底：其余全拒（必须放最后一行）

    # ------------------------------------------------ 防放大加固
    # 即使 ACL 失误，这些参数也让放大收益趋近于零
    minimal-responses: yes          # 响应不带额外记录（放大系数骤降）
    qname-minimisation: yes         # 上游只发必要查询，少泄露
    hide-identity: yes
    hide-version: yes
    deny-any: yes                   # ANY 查询直接拒（经典放大向量）
    rate-limit: 200                 # 单客户端每秒查询上限
    rate-limit-size: 4m
    ratelimit-for-domain: spamhaus.org 100    # 权威对突发限流，主动配合
    rrset-cache-size: 64m
    msg-cache-size: 32m
    infra-host-ttl: 900

    # 性能线程按机器改；2C4G 的 VPS 用 2
    num-threads: 2
    so-rcvbuf: 1m

    # ------------------------------------------------ 出口与隐私
    do-not-query-localhost: no
    # 可选：出口走指定网卡（多 IP VPS 上让 DNS 流量走干净 IP）
    # outgoing-interface: 203.0.113.10

    # root hints 内置即可；不必转发给 8.8.8.8 等公共解析器——
    # 转发出去就又回到"Spamhaus 拒绝公共解析器"的老路
    # forward-zone 段不要配置，保持纯递归。

remote-control:
    # 本机控制口给 unbound-control 用，也只听回环
    control-enable: yes
    control-interface: 127.0.0.1
    control-port: 8953
    server-key-file: "/etc/unbound/unbound_server.key"
    server-cert-file: "/etc/unbound/unbound_server.pem"
    control-key-file: "/etc/unbound/unbound_control.key"
    control-cert-file: "/etc/unbound/unbound_control.pem"
